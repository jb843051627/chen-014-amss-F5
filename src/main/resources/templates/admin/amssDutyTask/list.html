                        <option value="1">已派</option>

                    </select>
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="duty-query">
                    <i class="layui-icon layui-icon-search"></i>
                    查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i>
                    重置
                </button>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="duty-table" lay-filter="duty-table"></table>
    </div>
</div>
</body>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'form', 'jquery', 'layer', 'util'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;
        let layer = layui.layer;

        let MODULE_PATH = rootPath + "/amssDutyTask/";
        let cols = [
            [
                {title: '事项号', field: 'itemNo', align: 'center', width: 150},
                {title: '事项类别', field: 'itemType', align: 'center', width: 190, templet: '#duty-type'},
                {title: '到场末尾一刻', field: 'dueAt', align: 'center', width: 170},
                {title: '倒计时', field: 'dueAt', align: 'center', width: 100, templet: '#duty-countdown'},
                {title: '提前开口(日)', field: 'amount', align: 'center', width: 100},
                {title: '情形', field: 'status', align: 'center', width: 90, templet: '#duty-status'},
                {title: '受派班组 / 头一回', field: 'assignedTeamNo', align: 'center', width: 230, templet: '#duty-team'},
                {title: '派单事由', field: 'content', align: 'center'},
                {title: '挂起缘故', field: 'holdReason', align: 'center', width: 220},
                {title: '操作', toolbar: '#duty-bar', align: 'center', width: 110, fixed: 'right'}
            ]
        ];

        table.render({
            elem: '#duty-table',
            url: MODULE_PATH + 'list',
            page: true,
            method: 'get',
            cols: cols,
            skin: 'line',
            defaultToolbar: ['refresh', 'filter', 'print', 'exports'],
            where: {
                orderByColumn: "id",
                isAsc: "asc"
            }
        });

        table.on('tool(duty-table)', function (obj) {
            if (obj.event === 'logs') {
                window.showLogs(obj.data.itemNo);
            }
        });

        form.on('submit(duty-query)', function (data) {
            table.reload('duty-table', {where: data.field, page: {curr: 1}});
            return false;
        });

        // 只看一件事项的派出/收回流水；头一条不动，收回也不覆盖头回派给谁
        window.showLogs = function (itemNo) {
            let loading = layer.load();
            $.get(MODULE_PATH + 'logs/' + encodeURIComponent(itemNo), function (rows) {
                layer.close(loading);
                let html = '<table class="layui-table" style="margin:10px;width:96%;">'
                    + '<thead><tr><th>时刻</th><th>班组</th><th>动作</th><th>缘故</th></tr></thead><tbody>';
                if (!rows || rows.length === 0) {
                    html += '<tr><td colspan="4" style="text-align:center;">暂无流水</td></tr>';
                } else {
                    rows.forEach(function (r) {
                        html += '<tr><td>' + layui.util.toDateString(r.actionTime, 'yyyy-MM-dd HH:mm:ss')
                            + '</td><td>' + (r.teamNo || '')
                            + '</td><td>' + (r.action === 2 ? '收回' : '派出')
                            + '</td><td>' + (r.reason || '') + '</td></tr>';
                    });
                }
                html += '</tbody></table>';
                layer.open({
                    type: 1,
                    title: '事项 ' + itemNo + ' 派单流水（只读）',
                    area: ['640px', '360px'],
                    content: html
                });
            }).fail(function () {
                layer.close(loading);
                layer.msg('流水查询失败', {icon: 2});
            });
        };
    });
</script>
</html>
